name: Update contribution heatmap

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-contribution-heatmap.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: ${{ github.repository_owner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render animated SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated heatmap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No heatmap changes to commit."
          else
            git commit -m "chore: refresh contribution heatmap [skip ci]"
            git push
          fi
